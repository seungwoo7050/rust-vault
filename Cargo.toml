[workspace]
resolver = "3"
members = ["crates/vault", "crates/vault-sim"]
# 변형 검사 도구(mutants.sh)의 자체 테스트용 crate. workspace 밖에서 따로 빌드한다
exclude = ["scripts/harness/fixtures/mutants-demo"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
sha2 = "0.10"
proptest = "1"
# 서명·tx 인코딩(ARCHITECTURE 결정). 필요한 최소 crate만 쓴다
alloy-consensus = { version = "2.5", default-features = false, features = ["std", "k256"] }
alloy-eips = { version = "2.5", default-features = false, features = ["std"] }
alloy-primitives = { version = "1.7", default-features = false, features = ["std"] }
alloy-signer = "2.5"
alloy-signer-local = "2.5"
