[package]
name = "vault"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# DB가 있어야 도는 테스트(tests/db.rs, tests/ledger.rs, tests/deposit.rs, tests/invariants.rs)를 켠다. verify.sh full이 켠다
db = []

[dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
sha2.workspace = true
sqlx.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
vault-sim = { path = "../vault-sim" }

# 불변조건 증명 테스트는 DB가 있어야 돈다. verify fast는 DB 없이 돌므로 db 기능이 켜졌을 때만 빌드한다
[[test]]
name = "invariants"
path = "tests/invariants.rs"
required-features = ["db"]

[[test]]
name = "ledger"
path = "tests/ledger.rs"
required-features = ["db"]

[[test]]
name = "deposit"
path = "tests/deposit.rs"
required-features = ["db"]
